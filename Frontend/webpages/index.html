<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SpendWise - Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../CSS/global.css"><link rel="stylesheet" href="../CSS/index.css"></head>
<body><div class="container"><div class="sidebar-container"></div><div class="main"><div class="header">
    <div class="search"><input id="globalSearch" type="text" placeholder="Search transactions..."></div>
    <div class="profile"><span>🔔</span><div class="user"><div class="avatar">HM</div><span>Himanshu</span></div></div>
</div>
<div class="content"><div class="page-heading"><div><h1>Good Evening, Himanshu 🌱</h1><p>Here's your financial overview.</p></div></div>
<div class="summary-grid">
<div class="summary-card"><div class="summary-label">Total Balance</div><div class="summary-value" id="totalBalance">₹ 0</div></div>
<div class="summary-card"><div class="summary-label">Total Income</div><div class="summary-value positive" id="totalIncome">₹ 0</div></div>
<div class="summary-card"><div class="summary-label">Total Expense</div><div class="summary-value negative" id="totalExpense">₹ 0</div></div>
<div class="summary-card"><div class="summary-label">Savings Rate</div><div class="summary-value positive">—</div></div></div>
<div class="dashboard-grid"><div class="panel card"><h3>Recent Transactions</h3><div id="recentTransactions" class="mini-list"></div></div>
<div class="panel card"><h3>Quick Actions</h3><div class="mini-list"><div class="mini-row"><span>Add a transaction</span><a href="transactions.html">Open →</a></div><div class="mini-row"><span>Manage budgets</span><a href="budgets.html">Open →</a></div></div></div></div>
</div></div></div>
<script src="../JS/sidebar.js"></script><script src="../JS/dashboard.js"></script></body></html>
