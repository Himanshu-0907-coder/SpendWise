<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SpendWise - Transactions</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../CSS/global.css"><link rel="stylesheet" href="../CSS/transactions.css"></head>
<body><div class="container"><div class="sidebar-container"></div><div class="main"><div class="header">
    <div class="search"><input id="globalSearch" type="text" placeholder="Search transactions..."></div>
    <div class="profile"><span>🔔</span><div class="user"><div class="avatar">HM</div><span>Himanshu</span></div></div>
</div>
<div class="content"><div class="page-heading"><div><h1>Transactions</h1><p>Track all your income and expenses.</p></div><button class="primary-btn add-transaction-btn">+ Add Transaction</button></div>
<div class="filters"><input placeholder="Search..."><select><option>All Types</option><option>income</option><option>expense</option></select><select><option>All Categories</option><option>Food</option><option>Travel</option><option>Shopping</option><option>Bills</option><option>Entertainment</option></select><input type="date"></div>
<div class="card table-wrap"><table class="transaction-table"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Type</th><th>Amount</th><th>Actions</th></tr></thead><tbody id="transactionBody"></tbody></table></div></div></div></div>
<div class="modal" id="transactionModal"><div class="modal-box"><div class="modal-head"><h2>Add Transaction</h2><button class="close" id="closeTransactionModal">&times;</button></div>
<form id="transactionForm"><div class="form-group"><label>Amount</label><input id="amount" type="number" min="0" required></div>
<div class="form-group"><label>Type</label><select id="type" required><option value="expense">Expense</option><option value="income">Income</option></select></div>
<div class="form-group"><label>Category</label><select id="category" required><option value="">Select Category</option><option>Food</option><option>Travel</option><option>Shopping</option><option>Bills</option><option>Entertainment</option><option>Salary</option><option>Other</option></select></div>
<div class="form-group"><label>Description</label><input id="description" required></div><div class="form-group"><label>Date</label><input id="date" type="date" required></div>
<div class="modal-actions"><button type="button" class="cancel" id="cancelTransaction">Cancel</button><button class="primary-btn" type="submit">Save Transaction</button></div></form></div></div>
<script src="../JS/sidebar.js"></script><script src="../JS/transactions.js"></script></body></html>
